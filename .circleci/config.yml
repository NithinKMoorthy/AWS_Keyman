dependencies: &dependencies
  name: install dependencies
  command: |
    python -m venv venv || virtualenv venv
    . venv/bin/activate
    pip install -r requirements.txt
    pip install -r test_requirements.txt

tests: &tests
  name: run tests
  command: |
    . venv/bin/activate
    pytest --cov=aws_okta_keyman -v

pycodestyle: &pycodestyle
    name: pycodestyle
    command: |
      . venv/bin/activate
      python setup.py pycodestyle

pyflakes: &pyflakes
    name: pyflakes
    command: |
      . venv/bin/activate
      python setup.py pyflakes

version: 2
workflows:
  version: 2
  test:
    jobs:
      - test-3.13

jobs:
  test-3.13:
    steps:
      - checkout
      - run: *dependencies
      - run: *tests
      - run: *pycodestyle
      - run: *pyflakes
    docker:
      - image: cimg/python:3.13
